            - partial
            - unknown
            - no_reports
            - not_enrolled
            - out_of_retention
          description: 数据状态；与在线状态无关
        known_model_calls:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          maxLength: 19
          description: 有用量的调用；非负 int64 十进制字符串，最大 9223372036854775807
        unknown_model_calls:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          maxLength: 19
          description: 无可靠用量的调用；非负 int64 十进制字符串，最大 9223372036854775807
        measured_file_operations:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          maxLength: 19
          description: 可靠计量文件操作；非负 int64 十进制字符串，最大 9223372036854775807
        unmeasured_file_operations:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          maxLength: 19
          description: 未计量文件操作；非负 int64 十进制字符串，最大 9223372036854775807
        last_received_at:
          anyOf:
            - type: string

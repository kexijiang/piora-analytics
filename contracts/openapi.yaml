      type: object
      additionalProperties: false
      properties:
        event_id: *a10
        code:
          type: string
          enum:
            - INVALID_EVENT
            - EVENT_CONFLICT
            - UNSUPPORTED_VERSION
            - EVENT_TOO_OLD
            - CLOCK_SUSPECT
          description: 拒绝原因
        message:
          type: string
          description: 安全信息
          minLength: 1
          maxLength: 300
        retryable:
          type: boolean
          const: false

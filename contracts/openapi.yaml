components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: __Host-piora_analytics
    InstallationToken:
      type: http
      scheme: bearer
      description: pa1.<credential_id>.<secret>
    EnrollmentToken:
      type: http
      scheme: bearer
      description: enroll.<key_id>.<secret>；仅可注册
  schemas:
    ErrorBody:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: 稳定机器错误码
          minLength: 1
          maxLength: 64
        message:
          type: string
          description: 安全错误信息，不含密钥或对话
          minLength: 1
          maxLength: 512
        retryable:
          type: boolean
          description: 是否可按协议自动重试
        request_id: &a10
          type: string
          format: uuid
          description: 稳定 UUID，不能使用用户名代替
        field_errors:
          type: array
          items:

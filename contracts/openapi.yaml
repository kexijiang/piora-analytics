    SyncPolicy:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          description: 策略版本
          minimum: 0
          maximum: 1000000
        enabled:
          type: boolean
          description: 组织采集是否启用
        interval_min_seconds:
          type: integer
          description: 正常同步最小间隔，正整数秒；后台可设置任意正整数分钟
          minimum: 1
          default: 1500
        interval_max_seconds:
          type: integer
          description: 正常同步最大间隔，不小于最小间隔；不设业务时间上限
          minimum: 1
          default: 2100
        initial_delay_min_seconds:
          type: integer
          description: 首次/逾期启动最小抖动
          minimum: 0
          maximum: 600
          default: 60
        initial_delay_max_seconds:
          type: integer
          description: 首次/逾期启动最大抖动
          minimum: 0
          maximum: 600
          default: 300
        reconnect_min_seconds:
          type: integer
          description: 网络恢复最小抖动
          minimum: 0
          maximum: 1800
          default: 120
        reconnect_max_seconds:
          type: integer
          description: 网络恢复最大抖动
          minimum: 0
          maximum: 1800
          default: 600
        max_batch_events:
          type: integer
          description: 每批事件上限
          minimum: 1
          maximum: 500
          default: 500
        max_batch_bytes:
          type: integer
          description: 未压缩 JSON 字节上限
          minimum: 4096
          maximum: 262144
          default: 262144
        queue_max_days:
          type: integer
          description: 本地保留天数
          minimum: 1
          maximum: 30
          default: 30
        queue_max_bytes:
          type: integer
          description: 本地队列字节上限
          minimum: 1048576
          maximum: 268435456
          default: 268435456
      required:
        - version
        - enabled
        - interval_min_seconds
        - interval_max_seconds
        - initial_delay_min_seconds
        - initial_delay_max_seconds
        - reconnect_min_seconds
        - reconnect_max_seconds
        - max_batch_events
        - max_batch_bytes
        - queue_max_days
        - queue_max_bytes

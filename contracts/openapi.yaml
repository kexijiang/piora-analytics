            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: 请求体过大
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 业务规则或查询保留范围不满足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: 限流；遵守 Retry-After
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          headers:
            Retry-After:
              description: 整数秒；存在时优先于本地退避
              schema:
                type: integer
                minimum: 1
                maximum: 7200
        "503":
          description: 依赖不可用；不得确认未持久事件

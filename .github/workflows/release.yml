name: Release Image
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check && npm run typecheck && npm test && npm run build
      - uses: docker/setup-buildx-action@v3
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
      - name: Smoke test isolated Compose deployment
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          APP_VERSION: ${{ github.ref_name }}
          POSTGRES_PASSWORD: disposable-compose-test
          ANALYTICS_PEPPER: disposable-compose-test-pepper-32-characters
          ANALYTICS_ORIGIN: http://127.0.0.1:4319
          ALLOW_HTTP: 'true'
          INIT_ADMIN_PASSWORD: disposable-admin-password
        run: |
          docker compose -p release-test up -d --no-build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:4319/health/ready
          node scripts/smoke-compose.mjs
          docker compose -p release-test run --rm init
          docker compose -p release-test down -v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image and offline archive
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ github.ref_name }}
        run: |
          docker push "$IMAGE:$VERSION"
          if [[ "$VERSION" != *-* ]]; then docker push "$IMAGE:latest"; fi
          docker save "$IMAGE:$VERSION" -o "piora-analytics-$VERSION-linux-amd64.tar"
          sha256sum "piora-analytics-$VERSION-linux-amd64.tar" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: piora-analytics-${{ github.ref_name }}-linux-amd64
          path: |
            piora-analytics-*-linux-amd64.tar
            SHA256SUMS
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            piora-analytics-*-linux-amd64.tar
            SHA256SUMS
            compose.yaml
            compose.config.yaml
            .env.docker.example

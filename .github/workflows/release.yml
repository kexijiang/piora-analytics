name: Release Image
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check && npm run typecheck && npm test && npm run build
      - uses: docker/setup-buildx-action@v3
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
      - name: Smoke test isolated Compose deployment
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          APP_VERSION: ${{ github.ref_name }}
          POSTGRES_PASSWORD: disposable-compose-test
          ANALYTICS_PEPPER: disposable-compose-test-pepper-32-characters
          ANALYTICS_ORIGIN: http://127.0.0.1:4319
          ALLOW_HTTP: 'true'
          INIT_ADMIN_PASSWORD: disposable-admin-password
        run: |
          export COMPOSE_PROJECT_NAME=release-test
          export CONFIG_DIR="$RUNNER_TEMP/piora/config"
          export POSTGRES_DATA_DIR="$RUNNER_TEMP/piora/postgres"
          export EXPORT_DATA_DIR="$RUNNER_TEMP/piora/exports"
          mkdir -p "$CONFIG_DIR" "$POSTGRES_DATA_DIR" "$EXPORT_DATA_DIR"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const keys = ['IMAGE_NAME', 'APP_VERSION', 'POSTGRES_PASSWORD', 'ANALYTICS_PEPPER', 'ANALYTICS_ORIGIN', 'ALLOW_HTTP', 'INIT_ADMIN_PASSWORD', 'POSTGRES_DATA_DIR', 'EXPORT_DATA_DIR'];
          writeFileSync(`${process.env.CONFIG_DIR}/.env`, keys.map(key => `${key}=${process.env[key]}`).join('\n') + '\n', { mode: 0o600 });
          NODE
          sudo chown -R "1000:$(id -g)" "$CONFIG_DIR" "$EXPORT_DATA_DIR"
          sudo chmod 750 "$CONFIG_DIR" "$EXPORT_DATA_DIR"
          sudo chmod 640 "$CONFIG_DIR/.env"
          trap 'docker compose --env-file "$CONFIG_DIR/.env" down' EXIT
          docker compose --env-file "$CONFIG_DIR/.env" pull database
          bash scripts/start.sh offline
          curl --fail http://127.0.0.1:4319/health/ready
          node scripts/smoke-compose.mjs
          for service in api worker; do
            container=$(docker compose --env-file "$CONFIG_DIR/.env" ps -q "$service")
            test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/config"}}{{.RW}}{{end}}{{end}}' "$container")" = false
            docker compose --env-file "$CONFIG_DIR/.env" exec -T "$service" node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; assert.throws(() => fs.writeFileSync("/config/.readonly-probe", "probe"), {code: "EROFS"});'
          done
          docker compose --env-file "$CONFIG_DIR/.env" run --rm init
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image and offline archive
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ github.ref_name }}
        run: |
          docker push "$IMAGE:$VERSION"
          if [[ "$VERSION" != *-* ]]; then docker push "$IMAGE:latest"; fi
          docker save "$IMAGE:$VERSION" -o "piora-analytics-$VERSION-linux-amd64.tar"
          sha256sum "piora-analytics-$VERSION-linux-amd64.tar" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: piora-analytics-${{ github.ref_name }}-linux-amd64
          path: |
            piora-analytics-*-linux-amd64.tar
            SHA256SUMS
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            piora-analytics-*-linux-amd64.tar
            SHA256SUMS
            compose.yaml
            scripts/start.sh
            .env.docker.example

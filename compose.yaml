services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: piora_analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d piora_analytics"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://analytics:${POSTGRES_PASSWORD}@database:5432/piora_analytics
      ANALYTICS_PEPPER: ${ANALYTICS_PEPPER:?Set ANALYTICS_PEPPER}
      ANALYTICS_ORIGIN: ${ANALYTICS_ORIGIN:?Set HTTPS origin}
      HOST: 0.0.0.0
      PORT: 4319
      SERVE_DASHBOARD: "true"
      EXPORT_DIR: /exports
    ports:
      - "127.0.0.1:4319:4319"
    volumes:
      - exports:/exports
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["node", "apps/worker/src/main.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://analytics:${POSTGRES_PASSWORD}@database:5432/piora_analytics
      ANALYTICS_PEPPER: ${ANALYTICS_PEPPER}
      EXPORT_DIR: /exports
    volumes:
      - exports:/exports
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
  exports:

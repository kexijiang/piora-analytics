# Host-directory configuration and data mode. Use --env-file <CONFIG_DIR>/.env.
services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: piora_analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:?Set POSTGRES_DATA_DIR to an existing host
          directory}
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U analytics -d piora_analytics
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  init:
    image: ${IMAGE_NAME:-piora-analytics}:${APP_VERSION:-latest}
    build: .
    command:
      - node
      - --env-file=/config/.env
      - scripts/setup.mjs
    environment:
      DATABASE_URL: postgresql://analytics:${POSTGRES_PASSWORD}@database:5432/piora_analytics
      INIT_IF_EMPTY: "true"
    depends_on:
      database:
        condition: service_healthy
    restart: no
    volumes:
      - type: bind
        source: ${CONFIG_DIR:-./config}
        target: /config
        read_only: true
        bind:
          create_host_path: false
  api:
    image: ${IMAGE_NAME:-piora-analytics}:${APP_VERSION:-latest}
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://analytics:${POSTGRES_PASSWORD}@database:5432/piora_analytics
      HOST: 0.0.0.0
      PORT: 4319
      SERVE_DASHBOARD: "true"
      EXPORT_DIR: /exports
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-4319}:4319
    volumes:
      - type: bind
        source: ${EXPORT_DATA_DIR:?Set EXPORT_DATA_DIR to an existing host directory}
        target: /exports
        bind:
          create_host_path: false
      - type: bind
        source: ${CONFIG_DIR:-./config}
        target: /config
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4319/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    command:
      - node
      - --env-file=/config/.env
      - apps/api/src/main.mjs
  worker:
    image: ${IMAGE_NAME:-piora-analytics}:${APP_VERSION:-latest}
    build: .
    command:
      - node
      - --env-file=/config/.env
      - apps/worker/src/main.mjs
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://analytics:${POSTGRES_PASSWORD}@database:5432/piora_analytics
      EXPORT_DIR: /exports
    volumes:
      - type: bind
        source: ${EXPORT_DATA_DIR:?Set EXPORT_DATA_DIR to an existing host directory}
        target: /exports
        bind:
          create_host_path: false
      - type: bind
        source: ${CONFIG_DIR:-./config}
        target: /config
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    restart: unless-stopped
